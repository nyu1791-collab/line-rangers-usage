<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINEレンジャー 使用率チェッカー</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #06c755;
            --muted-color: #94a3b8;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 16px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .label {
            color: var(--muted-color);
            font-size: 0.9rem;
        }
        .value {
            font-weight: 600;
            font-size: 0.95rem;
            text-align: right;
            word-break: break-all;
            max-width: 65%;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 9999px;
            background-color: rgba(6, 199, 85, 0.2);
            color: var(--accent-color);
            font-size: 0.85rem;
        }
        .error {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
        }
        .loading {
            text-align: center;
            color: var(--muted-color);
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LINEレンジャー 使用率チェッカー</h1>
        </header>

        <main id="app">
            <div class="card">
                <div class="loading">データを読み込み中...</div>
            </div>
        </main>
    </div>

    <script>
        // スマホの強烈なキャッシュを回避するためタイムスタンプを付与
        const jsonUrl = './data/current.json?t=' + new Date().getTime();

        fetch(jsonUrl, { cache: 'no-store' })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTPエラー (${response.status})`);
                }
                return response.json();
            })
            .then(data => {
                const app = document.getElementById('app');
                let html = '<div class="card">';

                if (data.updated_at) {
                    html += `
                        <div class="info-item">
                            <span class="label">最終更新</span>
                            <span class="value">${data.updated_at}</span>
                        </div>
                    `;
                }
                if (data.status) {
                    html += `
                        <div class="info-item">
                            <span class="label">ステータス</span>
                            <span class="value"><span class="status-badge">${data.status}</span></span>
                        </div>
                    `;
                }
                if (data.details) {
                    html += `
                        <div class="info-item">
                            <span class="label">詳細</span>
                            <span class="value">${data.details}</span>
                        </div>
                    `;
                }

                // その他の追加データが存在する場合も自動取得して表示
                Object.keys(data).forEach(key => {
                    if (!['updated_at', 'status', 'details'].includes(key)) {
                        const val = typeof data[key] === 'object' ? JSON.stringify(data[key], null, 2) : data[key];
                        html += `
                            <div class="info-item">
                                <span class="label">${key}</span>
                                <span class="value">${val}</span>
                            </div>
                        `;
                    }
                });

                html += '</div>';
                app.innerHTML = html;
            })
            .catch(error => {
                const app = document.getElementById('app');
                app.innerHTML = `
                    <div class="error">
